<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Simple "ring" icon, filled with an explicit BLUE (#007aff) so the
       isolated <img> case visibly renders its OWN color — not the host's red,
       not the black fallback. -->
  <circle cx="50" cy="50" r="40" fill="#007aff"/>
  <circle cx="50" cy="50" r="18" fill="white"/>
</svg>
