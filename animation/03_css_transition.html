<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SVG Animation — CSS transition</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:#f5f5f7; color:#1d1d1f; margin:0; padding:16px; }
  h1 { font-size:20px; border-bottom:2px solid #d2d2d7; padding-bottom:8px; }
  h1 span.status { font-size:13px; font-weight:normal; color:#86868b; margin-left:12px; }
  .card { background:#fff; border:1px solid #d2d2d7; border-radius:8px; padding:12px; margin:12px 0; box-shadow:0 2px 4px rgba(0,0,0,.05); }
  .card h3 { margin:0 0 8px; font-size:13px; color:#86868b; }
  .card svg { background:#fafafa; border:1px dashed #bcbcf2; display:block; }
  .card p { font-size:12px; color:#515154; margin:8px 0 0; line-height:1.4; }
  .card button { margin-top:8px; }
  code { background:#f2f2f7; padding:1px 5px; border-radius:4px; font-size:12px; }

  .tr-hover { fill:#007aff; transition: fill 0.5s ease, transform 0.5s ease; transform-origin:60px 60px; cursor:pointer; }
  .tr-hover:hover { fill:#ff3b30; transform:scale(1.25); }

  .tr-class { fill:#34c759; opacity:1; transition: fill 0.6s ease, opacity 0.6s ease, transform 0.6s ease; }
  .tr-class.on { fill:#af52de; opacity:0.35; transform:translateX(90px); }
</style>
</head>
<body>
<h1>SVG Animation — CSS <code>transition</code> <span class="status">✅ supported</span></h1>

<div class="card">
  <h3>1. <code>:hover</code> transition (fill + scale)</h3>
  <svg width="360" height="120" viewBox="0 0 360 120">
    <rect x="30" y="40" width="60" height="40" rx="10" class="tr-hover"/>
  </svg>
  <p>Hover the shape to smoothly transition <code>fill</code> and <code>transform: scale()</code>.</p>
</div>

<div class="card">
  <h3>2. Class-toggle transition (fill + opacity + translate)</h3>
  <svg width="360" height="120" viewBox="0 0 360 120">
    <circle id="t2" cx="50" cy="60" r="26" class="tr-class"/>
  </svg>
  <p><button id="t2btn">Toggle class</button></p>
  <p>JS toggles a class; <code>fill</code>, <code>opacity</code> and <code>transform</code> transition smoothly.</p>
</div>

<script>
  document.getElementById('t2btn').onclick = () =>
    document.getElementById('t2').classList.toggle('on');
</script>
</body>
</html>
