<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SVG Animation — JS setAttribute</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:#f5f5f7; color:#1d1d1f; margin:0; padding:16px; }
  h1 { font-size:20px; border-bottom:2px solid #d2d2d7; padding-bottom:8px; }
  h1 span.status { font-size:13px; font-weight:normal; color:#86868b; margin-left:12px; }
  .card { background:#fff; border:1px solid #d2d2d7; border-radius:8px; padding:12px; margin:12px 0; box-shadow:0 2px 4px rgba(0,0,0,.05); }
  .card h3 { margin:0 0 8px; font-size:13px; color:#86868b; }
  .card svg { background:#fafafa; border:1px dashed #bcbcf2; display:block; }
  .card p { font-size:12px; color:#515154; margin:8px 0 0; line-height:1.4; }
  code { background:#f2f2f7; padding:1px 5px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
<h1>SVG Animation — JS <code>setAttribute()</code> <span class="status">✅ supported</span></h1>

<div class="card">
  <h3>1. Position via <code>cx</code> + color via <code>fill</code></h3>
  <svg id="s1" width="360" height="120" viewBox="0 0 360 120">
    <circle id="c1" cx="60" cy="60" r="24" fill="#007aff"/>
  </svg>
  <p>A JS <code>requestAnimationFrame</code> loop mutates <code>cx</code> (bounce) and <code>fill</code> (color cycle) on the same circle.</p>
</div>

<div class="card">
  <h3>2. Size via <code>width</code>/<code>height</code> + <code>rx</code></h3>
  <svg id="s2" width="360" height="120" viewBox="0 0 360 120">
    <rect id="c2" x="120" y="40" width="80" height="40" rx="10" fill="#34c759"/>
  </svg>
  <p>Pulses the rectangle's <code>width</code>, <code>height</code> and corner radius <code>rx</code>.</p>
</div>

<script>
  const t0 = performance.now();
  const COLORS = ['#007aff', '#ff9500', '#34c759', '#af52de'];

  function tick(now) {
    const t = (now - t0) / 1000;

    // Card 1: bounce cx + cycle fill.
    const c1 = document.getElementById('c1');
    c1.setAttribute('cx', (60 + 130 * Math.abs(Math.sin(t * 1.6))).toFixed(1));
    c1.setAttribute('fill', COLORS[Math.floor(t * 1.5) % COLORS.length]);

    // Card 2: pulse width/height/rx.
    const c2 = document.getElementById('c2');
    const w = 40 + 60 * (0.5 + 0.5 * Math.sin(t * 2.2));
    const h = 20 + 30 * (0.5 + 0.5 * Math.sin(t * 2.2));
    c2.setAttribute('width', w.toFixed(1));
    c2.setAttribute('height', h.toFixed(1));
    c2.setAttribute('rx', (4 + 14 * (0.5 + 0.5 * Math.sin(t * 2.2))).toFixed(1));

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
