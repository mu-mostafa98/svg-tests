<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SVG Animation — JS inline style (el.style)</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:#f5f5f7; color:#1d1d1f; margin:0; padding:16px; }
  h1 { font-size:20px; border-bottom:2px solid #d2d2d7; padding-bottom:8px; }
  h1 span.status { font-size:13px; font-weight:normal; color:#86868b; margin-left:12px; }
  .card { background:#fff; border:1px solid #d2d2d7; border-radius:8px; padding:12px; margin:12px 0; box-shadow:0 2px 4px rgba(0,0,0,.05); }
  .card h3 { margin:0 0 8px; font-size:13px; color:#86868b; }
  .card svg { background:#fafafa; border:1px dashed #bcbcf2; display:block; }
  .card p { font-size:12px; color:#515154; margin:8px 0 0; line-height:1.4; }
  code { background:#f2f2f7; padding:1px 5px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
<h1>SVG Animation — JS inline style <span class="status">✅ supported</span></h1>

<div class="card">
  <h3>1. <code>el.style.fill</code> + <code>el.style.opacity</code></h3>
  <svg width="360" height="120" viewBox="0 0 360 120">
    <circle id="c1" cx="60" cy="60" r="26" fill="#007aff"/>
  </svg>
  <p>A <code>requestAnimationFrame</code> loop writes <code>style.fill</code> (color cycle) and <code>style.opacity</code> (pulse).</p>
</div>

<div class="card">
  <h3>2. <code>el.style.strokeWidth</code> + <code>el.style.transform</code></h3>
  <svg width="360" height="120" viewBox="0 0 360 120">
    <rect id="c2" x="150" y="40" width="60" height="40" rx="8" fill="none"
          stroke="#ff9500" style="stroke-width:4"/>
  </svg>
  <p>Pulses <code>style.strokeWidth</code> and translates via <code>style.transform</code>.</p>
</div>

<script>
  const t0 = performance.now();
  const COLORS = ['#007aff', '#ff9500', '#34c759', '#af52de'];

  function tick(now) {
    const t = (now - t0) / 1000;

    const c1 = document.getElementById('c1');
    c1.style.fill = COLORS[Math.floor(t * 1.5) % COLORS.length];
    c1.style.opacity = (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 2))).toFixed(2);

    const c2 = document.getElementById('c2');
    c2.style.strokeWidth = (3 + 7 * (0.5 + 0.5 * Math.sin(t * 2.5))).toFixed(1);
    c2.style.transform = 'translate(' + (30 * Math.sin(t * 1.8)).toFixed(1) + 'px, ' + (20 * Math.cos(t * 1.8)).toFixed(1) + 'px)';

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
