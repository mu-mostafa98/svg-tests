<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SVG path d animation</title>
<style>
  body { font-family: sans-serif; margin: 2rem; }
  .card { display: inline-block; vertical-align: top; margin: 1rem; }
  h3 { font-size: 14px; margin: 0 0 6px; }

  /* Morph a square left → right. from/to must have the same command count
     (M L L L Z = 5 commands) so stylo can interpolate the path. */
  @keyframes morph-d {
    from { d: path("M 20 20 L 80 20 L 80 80 L 20 80 Z"); }
    to   { d: path("M 120 20 L 180 20 L 180 80 L 120 80 Z"); }
  }
  .morph {
    animation: morph-d 2s ease-in-out infinite alternate;
    fill: #007aff;
  }
</style>
</head>
<body>

<div class="card">
  <h3>1. @keyframes d (square morphs left ⇄ right)</h3>
  <svg width="200" height="100" viewBox="0 0 200 100">
    <path class="morph"/>
  </svg>
  <p>The blue square must slide/morph between the left and right positions continuously.</p>
</div>

</body>
</html>
